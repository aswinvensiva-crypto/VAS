# JARVIS's built-in neurons.
#
# Each synapse maps spoken orders to neurons — actions that run right here on
# this PC, instantly, without asking Claude. Anything that matches none of them
# goes to Claude as usual.
#
# Orders are templates: {{name}} captures words. matching-type is how strictly
# the words must line up (after "hey jarvis", "please", "can you"… are
# dropped):
#   normal          every word of the order appears; extra words are fine
#   strict          the same words and no others, in any order
#   ordered-strict  exactly these words, in this order
#
# A synapse marked `routine-only: true` is never matched against what you
# say; it only lets a routine you teach use it as a step (see "say" below).
#
# Your own routines (taught by voice, or written by hand) live in
# %APPDATA%\VAS\data\brain.yml and win over these when both fit.

version: 1
synapses:
  # --- the basics ------------------------------------------------------------
  - name: time
    signals:
      - order: { text: "what time is it", matching-type: ordered-strict }
      - order: { text: "what's the time", matching-type: ordered-strict }
      - order: { text: "what is the time", matching-type: ordered-strict }
      - order: { text: "tell me the time", matching-type: ordered-strict }
      - order: { text: "what time is it now", matching-type: ordered-strict }
      - order: { text: "what time is it right now", matching-type: ordered-strict }
      - order: { text: "what's the time now", matching-type: ordered-strict }
      - order: { text: "what is the time now", matching-type: ordered-strict }
    neurons:
      - time: {}

  - name: date
    signals:
      - order: { text: "what's the date", matching-type: ordered-strict }
      - order: { text: "what is the date", matching-type: ordered-strict }
      - order: { text: "what's the date today", matching-type: ordered-strict }
      - order: { text: "what is the date today", matching-type: ordered-strict }
      - order: { text: "what's today's date", matching-type: ordered-strict }
      - order: { text: "what is today's date", matching-type: ordered-strict }
      - order: { text: "today's date", matching-type: ordered-strict }
      - order: { text: "what day is it", matching-type: ordered-strict }
      - order: { text: "what day is it today", matching-type: ordered-strict }
      - order: { text: "what day is today", matching-type: ordered-strict }
    neurons:
      - date: {}

  - name: repeat
    signals:
      - order: { text: "what did you say", matching-type: ordered-strict }
      - order: { text: "say that again", matching-type: ordered-strict }
      - order: { text: "repeat that", matching-type: ordered-strict }
    neurons:
      - repeat: {}

  # --- standing down -----------------------------------------------------------
  - name: sleep
    signals:
      - order: { text: "go to sleep", matching-type: ordered-strict }
      - order: { text: "that's all", matching-type: ordered-strict }
      - order: { text: "stand down", matching-type: ordered-strict }
    neurons:
      - kill_switch: { mode: sleep }

  - name: mute
    signals:
      - order: { text: "stop listening", matching-type: ordered-strict }
      - order: { text: "mute yourself", matching-type: ordered-strict }
    neurons:
      - kill_switch: { mode: mute }

  - name: quit
    signals:
      - order: { text: "shut down vas", matching-type: ordered-strict }
      - order: { text: "quit vas", matching-type: ordered-strict }
      - order: { text: "shut yourself down", matching-type: ordered-strict }
    neurons:
      - kill_switch: { mode: quit }

  - name: lockdown
    signals:
      - order: { text: "lock down", matching-type: ordered-strict }
      - order: { text: "lockdown", matching-type: ordered-strict }
    neurons:
      - kill_switch: { mode: lockdown }

  - name: unlock
    signals:
      - order: { text: "unlock", matching-type: ordered-strict }
      - order: { text: "end lockdown", matching-type: ordered-strict }
    neurons:
      - kill_switch: { mode: unlock }

  - name: learn-voice
    signals:
      - order: { text: "learn my voice", matching-type: ordered-strict }
      - order: { text: "enroll my voice", matching-type: ordered-strict }
      - order: { text: "train my voice", matching-type: ordered-strict }
    neurons:
      - voice_setup: { mode: enroll }

  - name: forget-voice
    signals:
      - order: { text: "forget my voice", matching-type: ordered-strict }
    neurons:
      - voice_setup: { mode: forget }

  # --- Windows apps --------------------------------------------------------------
  - name: open-app
    signals:
      - order: { text: "open {{app}}", matching-type: ordered-strict }
      - order: { text: "launch {{app}}", matching-type: ordered-strict }
      - order: { text: "start {{app}}", matching-type: ordered-strict }
    neurons:
      - open_app: { app: "{{app}}" }

  - name: close-app
    signals:
      - order: { text: "close {{app}}", matching-type: ordered-strict }
      - order: { text: "quit {{app}}", matching-type: ordered-strict }
      - order: { text: "exit {{app}}", matching-type: ordered-strict }
    neurons:
      - close_app: { app: "{{app}}" }

  - name: focus-app
    signals:
      - order: { text: "switch to {{app}}", matching-type: ordered-strict }
      - order: { text: "bring up {{app}}", matching-type: ordered-strict }
    neurons:
      - focus_app: { app: "{{app}}" }

  - name: list-apps
    signals:
      - order: { text: "what apps do i have", matching-type: ordered-strict }
      - order: { text: "list my apps", matching-type: ordered-strict }
    neurons:
      - list_apps: {}

  - name: refresh-apps
    signals:
      - order: { text: "refresh my apps", matching-type: ordered-strict }
      - order: { text: "refresh apps", matching-type: ordered-strict }
    neurons:
      - refresh_apps: {}

  # --- Chrome ----------------------------------------------------------------------
  - name: chrome-open
    signals:
      - order: { text: "open {{site}} in chrome", matching-type: ordered-strict }
      - order: { text: "go to {{site}}", matching-type: ordered-strict }
    neurons:
      - chrome_open: { site: "{{site}}" }

  - name: chrome-search
    signals:
      - order: { text: "search for {{query}}", matching-type: ordered-strict }
      - order: { text: "google {{query}}", matching-type: ordered-strict }
      - order: { text: "search {{query}} on google", matching-type: ordered-strict }
    neurons:
      - chrome_search: { query: "{{query}}" }

  - name: chrome-read
    signals:
      - order: { text: "read this page", matching-type: ordered-strict }
      - order: { text: "what's on this page", matching-type: ordered-strict }
      - order: { text: "what's on this tab", matching-type: ordered-strict }
      - order: { text: "what is on this page", matching-type: ordered-strict }
      - order: { text: "what is on this tab", matching-type: ordered-strict }
      - order: { text: "summarize this page", matching-type: ordered-strict }
      - order: { text: "summarise this page", matching-type: ordered-strict }
    neurons:
      - chrome_read_tab: {}

  # --- messages (through OpenClaw: Gmail, WhatsApp, Telegram) -----------------
  # Every send is read back and asked first; who and what are in the question.
  - name: email-send
    signals:
      - order: { text: "email {{to}} saying {{message}}", matching-type: ordered-strict }
      - order: { text: "send an email to {{to}} saying {{message}}", matching-type: ordered-strict }
      - order: { text: "email {{to}} that {{message}}", matching-type: ordered-strict }
    neurons:
      - send_email: { to: "{{to}}", message: "{{message}}" }

  - name: whatsapp-send
    signals:
      - order: { text: "whatsapp {{to}} saying {{message}}", matching-type: ordered-strict }
      - order: { text: "send a whatsapp to {{to}} saying {{message}}", matching-type: ordered-strict }
      - order: { text: "message {{to}} on whatsapp saying {{message}}", matching-type: ordered-strict }
      - order: { text: "whatsapp {{to}} that {{message}}", matching-type: ordered-strict }
    neurons:
      - send_whatsapp: { to: "{{to}}", message: "{{message}}" }

  - name: telegram-send
    signals:
      - order: { text: "telegram {{to}} saying {{message}}", matching-type: ordered-strict }
      - order: { text: "message {{to}} on telegram saying {{message}}", matching-type: ordered-strict }
    neurons:
      - send_telegram: { to: "{{to}}", message: "{{message}}" }

  - name: messages-check
    signals:
      - order: { text: "any new messages", matching-type: ordered-strict }
      - order: { text: "check my messages", matching-type: ordered-strict }
      - order: { text: "do i have any messages", matching-type: ordered-strict }
    neurons:
      - check_messages: {}

  - name: email-check
    signals:
      - order: { text: "check my email", matching-type: ordered-strict }
      - order: { text: "any new email", matching-type: ordered-strict }
      - order: { text: "any new emails", matching-type: ordered-strict }
      - order: { text: "do i have any new email", matching-type: ordered-strict }
    neurons:
      - check_messages: { channel: email }

  - name: whatsapp-check
    signals:
      - order: { text: "any new whatsapp messages", matching-type: ordered-strict }
      - order: { text: "check my whatsapp", matching-type: ordered-strict }
    neurons:
      - check_messages: { channel: whatsapp }

  - name: telegram-check
    signals:
      - order: { text: "any new telegram messages", matching-type: ordered-strict }
      - order: { text: "check my telegram", matching-type: ordered-strict }
    neurons:
      - check_messages: { channel: telegram }

  - name: message-read
    signals:
      - order: { text: "read the email from {{from}}", matching-type: ordered-strict }
      - order: { text: "read my email from {{from}}", matching-type: ordered-strict }
    neurons:
      - read_message: { from: "{{from}}", channel: email }

  - name: whatsapp-read
    signals:
      - order: { text: "read the whatsapp from {{from}}", matching-type: ordered-strict }
      - order: { text: "what did {{from}} say on whatsapp", matching-type: ordered-strict }
    neurons:
      - read_message: { from: "{{from}}", channel: whatsapp }

  # --- learning --------------------------------------------------------------------
  - name: correction
    signals:
      - order: { text: "no i said {{text}}", matching-type: ordered-strict }
      - order: { text: "i said {{text}}", matching-type: ordered-strict }
      - order: { text: "no i meant {{text}}", matching-type: ordered-strict }
      - order: { text: "i meant {{text}}", matching-type: ordered-strict }
    neurons:
      - correction: { text: "{{text}}" }

  - name: teach
    signals:
      - order: { text: "when i say {{spec}}", matching-type: ordered-strict }
      - order: { text: "whenever i say {{spec}}", matching-type: ordered-strict }
    neurons:
      - teach: { spec: "{{spec}}" }

  # A spoken line, as one step of a routine you teach ("when I say good
  # morning, say rise and shine, then open Spotify"). Routine-only: said to
  # JARVIS directly, "say something funny" is a question for Claude, not an
  # order to repeat the words back.
  - name: say
    routine-only: true
    signals:
      - order: { text: "say {{message}}", matching-type: ordered-strict }
    neurons:
      - say: { message: "{{message}}" }

  - name: forget-routine
    signals:
      - order: { text: "forget the routine {{name}}", matching-type: ordered-strict }
      - order: { text: "delete the routine {{name}}", matching-type: ordered-strict }
    neurons:
      - forget_routine: { name: "{{name}}" }

  - name: list-routines
    signals:
      - order: { text: "what routines do i have", matching-type: ordered-strict }
      - order: { text: "list my routines", matching-type: ordered-strict }
    neurons:
      - list_routines: {}
